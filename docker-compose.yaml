version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"

  app1:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - INSTANCE_NAME=app1
      - REDIS_URL=redis:6379
    depends_on:
      - redis

  app2:
    build: .
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - INSTANCE_NAME=app2
      - REDIS_URL=redis:6379
    depends_on:
      - redis

